<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 160" role="img" aria-labelledby="title desc">
  <title id="title">Banner institucional da Secretaria de Estado da Saude de Sao Paulo</title>
  <desc id="desc">Faixa azul com identificacao de CCD, CVE, Secretaria da Saude e Governo do Estado de Sao Paulo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b5d95" />
      <stop offset="100%" stop-color="#014a7a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#003554" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1920" height="160" fill="url(#bg)" />
  <rect x="0" y="140" width="1920" height="20" fill="#003b62" opacity="0.5" />

  <g fill="#ffffff" filter="url(#shadow)">
    <g transform="translate(70,52)">
      <text x="0" y="0" font-size="42" font-family="Arial, Helvetica, sans-serif" font-weight="800">CCD</text>
      <text x="0" y="22" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">COORDENADORIA</text>
      <text x="0" y="36" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600">DE CONTROLE DE DOENCAS</text>
    </g>

    <g transform="translate(290,34)">
      <rect x="0" y="0" width="14" height="54" rx="2" />
      <rect x="24" y="0" width="14" height="54" rx="2" />
      <rect x="48" y="20" width="14" height="34" rx="2" />
      <rect x="72" y="0" width="14" height="54" rx="2" />
      <text x="100" y="24" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="800">CVE</text>
      <text x="102" y="44" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="700">CENTRO DE VIGILANCIA</text>
      <text x="102" y="60" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="700">EPIDEMIOLOGICA</text>
      <text x="102" y="76" font-size="12" font-family="Arial, Helvetica, sans-serif">"Prof. Alexandre Vranjac"</text>
    </g>

    <g transform="translate(1080,58)">
      <text x="0" y="0" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="800">Secretaria da</text>
      <text x="0" y="44" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="800">Saude</text>
      <rect x="255" y="-36" width="92" height="92" rx="18" />
      <rect x="305" y="-60" width="92" height="92" rx="18" />
    </g>

    <g transform="translate(1450,38)">
      <text x="0" y="0" font-size="54" font-family="Arial, Helvetica, sans-serif" font-weight="800">SAO PAULO</text>
      <text x="0" y="32" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700">GOVERNO DO ESTADO</text>
      <text x="0" y="56" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">SAO PAULO SAO TODOS</text>
    </g>
  </g>
</svg>
